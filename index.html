<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automatic Timetable Generator Pro</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React and Babel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    
    <!-- Libraries for PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); border-radius: 20px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 20px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
        
        @keyframes pulse-soft {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .animate-pulse-soft { animation: pulse-soft 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .subject-card {
            border-width: 2px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.03);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .subject-card:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
        }

        .pdf-fix {
            letter-spacing: -0.02em;
            word-spacing: -0.05em;
        }

        #init-loader {
            position: fixed;
            inset: 0;
            background: #020617;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            transition: opacity 0.5s ease;
        }

        @media (min-width: 1024px) {
            .timetable-scale-wrapper {
                transform: scale(0.9);
                transform-origin: top center;
                margin-bottom: -5%;
            }
        }
    </style>
</head>
<body class="bg-slate-950 overflow-x-hidden">
    <div id="init-loader">
        <div class="text-center">
            <div class="w-16 h-16 border-4 border-teal-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
            <p class="text-teal-500 font-black uppercase tracking-[0.3em] text-[10px]">Initializing Architecture</p>
        </div>
    </div>
    
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, onAuthStateChanged, signInAnonymously, signInWithCustomToken } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, collection, doc, setDoc, addDoc, getDoc, onSnapshot, query, deleteDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        const { useState, useEffect, useRef } = React;

        const hideInitialLoader = () => {
            const loader = document.getElementById('init-loader');
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 500);
            }
        };
        hideInitialLoader();

        let app, auth, db;
        let appId = 'timetable-gen-pro';
        
        // Webhook URL
        const WEBHOOK_URL = 'https://n8n.srv1234891.hstgr.cloud/webhook/05e856e5-9745-40c2-955c-0e8e1e2f647c';

        const setupFirebase = () => {
            try {
                if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                    const firebaseConfig = JSON.parse(__firebase_config);
                    app = initializeApp(firebaseConfig);
                    auth = getAuth(app);
                    db = getFirestore(app);
                    appId = typeof __app_id !== 'undefined' ? __app_id : 'timetable-gen-pro';
                    return true;
                }
            } catch (e) {
                console.error("Firebase startup skipped.");
            }
            return false;
        };

        const hasCloud = setupFirebase();

        const IconSparkles = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
        );
        const IconLayout = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
        );
        const IconZap = ({ className, fill = "none" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14H4Z"/></svg>
        );
        const IconRefresh = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
        );
        const IconDownload = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
        );
        const IconHistory = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
        );
        const IconCoffee = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" x2="6" y1="2" y2="4"/><line x1="10" x2="10" y1="2" y2="4"/><line x1="14" x2="14" y1="2" y2="4"/></svg>
        );
        const IconCode = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
        );
        const IconUser = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        );

        function App() {
            const [user, setUser] = useState(null);
            const [className, setClassName] = useState('');
            const [subjectCount, setSubjectCount] = useState(4); 
            const [subjects, setSubjects] = useState([
                { id: '1', name: '', teacher: '', session: 'morning', weight: 1 },
                { id: '2', name: '', teacher: '', session: 'morning', weight: 1 },
                { id: '3', name: '', teacher: '', session: 'afternoon', weight: 1 },
                { id: '4', name: '', teacher: '', session: 'afternoon', weight: 1 }
            ]);
            const [rooms, setRooms] = useState('');
            const [loading, setLoading] = useState(false);
            const [timetable, setTimetable] = useState(null);
            const [error, setError] = useState(null);
            const [history, setHistory] = useState([]);
            const [showHistory, setShowHistory] = useState(false);
            const [successMsg, setSuccessMsg] = useState(null);

            const timetableRef = useRef(null);
            const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            
            const lectureSlots = [
                { label: '11:00 AM - 12:00 PM', key: '11-12' },
                { label: '12:00 PM - 01:00 PM', key: '12-1' },
                { label: '01:00 PM - 02:00 PM', key: '1-2', type: 'lunch' },
                { label: '02:00 PM - 03:00 PM', key: '2-3' },
                { label: '03:00 PM - 04:00 PM', key: '3-4' },
                { label: '04:00 PM - 05:00 PM', key: '4-5' },
                { label: '05:00 PM - 06:00 PM', key: '5-6' }
            ];

            useEffect(() => {
                if (!hasCloud) return;
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (err) {
                        console.error("Auth skipped.");
                    }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
                    setUser(currentUser);
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user || !db) return;
                const historyCollection = collection(db, 'artifacts', appId, 'users', user.uid, 'history');
                const unsubscribe = onSnapshot(historyCollection, 
                    (snapshot) => {
                        const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        setHistory(data.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0)));
                    }, 
                    (err) => console.error(err)
                );
                return () => unsubscribe();
            }, [user]);

            const getUniqueLiteStyle = (subjectName, index) => {
                if (!subjectName || subjectName === 'Coding Time') return {
                    backgroundColor: '#f8fafc', borderColor: '#f1f5f9', color: '#94a3b8', accentColor: '#f1f5f9'
                };
                let nameHash = 0;
                for (let i = 0; i < subjectName.length; i++) {
                    nameHash = subjectName.charCodeAt(i) + ((nameHash << 5) - nameHash);
                }
                const baseHue = (Math.abs(nameHash) + (index * 137.5)) % 360;
                const h = baseHue;
                const bg = `hsl(${h}, 55%, 97%)`;
                const border = `hsl(${h}, 40%, 90%)`;
                const text = `hsl(${h}, 70%, 15%)`;
                const accent = `hsl(${h}, 50%, 92%)`;
                return { backgroundColor: bg, borderColor: border, color: text, accentColor: accent };
            };

            const handleSubjectCountChange = (count) => {
                const val = Math.max(4, Math.min(12, parseInt(count) || 0));
                setSubjectCount(val);
                const newSubjects = [...subjects];
                if (val > subjects.length) {
                    for (let i = subjects.length; i < val; i++) {
                        newSubjects.push({ id: Math.random().toString(36).substr(2, 9), name: '', teacher: '', session: 'morning', weight: 1 });
                    }
                } else {
                    newSubjects.splice(val);
                }
                setSubjects(newSubjects);
            };

            const updateSubject = (index, field, value) => {
                const newSubjects = [...subjects];
                newSubjects[index][field] = value;
                setSubjects(newSubjects);
            };

            const handleReset = () => {
                setClassName('');
                setSubjectCount(4);
                setSubjects([
                    { id: '1', name: '', teacher: '', session: 'morning', weight: 1 },
                    { id: '2', name: '', teacher: '', session: 'morning', weight: 1 },
                    { id: '3', name: '', teacher: '', session: 'afternoon', weight: 1 },
                    { id: '4', name: '', teacher: '', session: 'afternoon', weight: 1 }
                ]);
                setRooms('');
                setTimetable(null);
                setError(null);
            };

            // NEW: Mapping logic for your specific backend format
            const transformBackendData = (rawList) => {
                const dayMap = { "Mon": "Monday", "Tue": "Tuesday", "Wed": "Wednesday", "Thu": "Thursday", "Fri": "Friday", "Sat": "Saturday" };
                const filteredSlots = lectureSlots.filter(ls => ls.type !== 'lunch');
                
                const nameCounters = {};
                
                return rawList.map(item => {
                    const fullDay = dayMap[item.day] || item.day;
                    const slotConfig = filteredSlots[item.slot - 1] || filteredSlots[0];
                    
                    nameCounters[item.subject] = (nameCounters[item.subject] || 0) + 1;

                    return {
                        day: fullDay,
                        slot: slotConfig.label,
                        key: slotConfig.key,
                        data: {
                            name: item.subject,
                            teacher: item.teacher,
                            room: item.room,
                            sequence: nameCounters[item.subject]
                        }
                    };
                });
            };

            const extractTimetableArray = (obj) => {
                if (!obj) return null;
                
                // If the response follows the specific format: { success: true, data: [...] }
                if (obj.success && Array.isArray(obj.data)) {
                    return transformBackendData(obj.data);
                }

                // Generic recursive search for arrays (as fallback)
                if (Array.isArray(obj)) {
                    if (obj.length > 0 && obj[0].day && obj[0].slot) return obj;
                    for (let item of obj) {
                        const found = extractTimetableArray(item);
                        if (found) return found;
                    }
                } 
                
                if (typeof obj === 'object') {
                    if (obj.timetable && Array.isArray(obj.timetable)) return obj.timetable;
                    if (obj.body) return extractTimetableArray(obj.body);
                    for (let key in obj) {
                        if (typeof obj[key] === 'object') {
                            const found = extractTimetableArray(obj[key]);
                            if (found) return found;
                        }
                    }
                }

                return null;
            };

            const saveToCloud = async (finalTimetable) => {
                const docData = {
                    className,
                    rooms,
                    subjects,
                    timetable: finalTimetable,
                    timestamp: Date.now(),
                    creatorId: user?.uid || 'offline'
                };
                
                try {
                    const response = await fetch(WEBHOOK_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(docData),
                    });

                    if (!response.ok) throw new Error("Webhook rejected request");

                    const rawResponse = await response.json();
                    const dataFromWebhook = extractTimetableArray(rawResponse);
                    
                    if (dataFromWebhook && Array.isArray(dataFromWebhook)) {
                        setTimetable(dataFromWebhook);
                        setSuccessMsg("Synchronized successfully.");
                    } else {
                        throw new Error("Webhook returned invalid data format.");
                    }
                    
                    setTimeout(() => setSuccessMsg(null), 2000);

                    if (user && db) {
                        const historyCollection = collection(db, 'artifacts', appId, 'users', user.uid, 'history');
                        await addDoc(historyCollection, docData);
                    }
                } catch (err) {
                    console.error("Webhook display error:", err);
                    setError(err.message || "Failed to sync with secure webhook.");
                    setTimetable(null); 
                }
            };

            const generateTimetable = async () => {
                const validSubjects = subjects.filter(s => s.name && s.name.trim() !== '');
                if (validSubjects.length < 4) {
                    setError('Enter at least 4 subjects.');
                    return;
                }
                setLoading(true);
                setError(null);
                
                try {
                    const roomList = rooms.split(',').map(r => r.trim()).filter(r => r !== '');
                    const primaryRoom = roomList[0] || 'GEN-1';
                    const dailySlots = [];

                    days.forEach(day => {
                        lectureSlots.filter(ls => ls.type !== 'lunch').forEach((slot, idx) => {
                            dailySlots.push({ 
                                day, slot: slot.label, key: slot.key,
                                session: idx < 2 ? 'morning' : 'afternoon',
                                occupied: false, data: null
                            });
                        });
                    });

                    const usageTracker = {}; 
                    days.forEach(d => usageTracker[d] = {});

                    const lowFreqSubs = validSubjects.filter(s => s.weight <= 2);
                    lowFreqSubs.forEach(sub => {
                        const targetFreq = sub.weight === 1 ? 2 : 4;
                        let placed = 0;
                        const potentialSlots = dailySlots.filter(s => !s.occupied).sort(() => Math.random() - 0.5);
                        for (let sObj of potentialSlots) {
                            if (placed >= targetFreq) break;
                            const count = usageTracker[sObj.day][sub.name] || 0;
                            if (count < 2 && sObj.session === sub.session) {
                                sObj.occupied = true;
                                sObj.data = { ...sub, room: primaryRoom };
                                usageTracker[sObj.day][sub.name] = count + 1;
                                placed++;
                            }
                        }
                    });

                    const highWeightSubs = validSubjects.filter(s => s.weight >= 3);
                    const remainingSlots = dailySlots.filter(s => !s.occupied).sort(() => Math.random() - 0.5);
                    remainingSlots.forEach(sObj => {
                        const eligible = highWeightSubs.filter(sub => (usageTracker[sObj.day][sub.name] || 0) < 2);
                        if (eligible.length > 0) {
                            const pool = [];
                            eligible.forEach(e => { for(let i=0; i<e.weight; i++) pool.push(e); });
                            const sel = pool[Math.floor(Math.random() * pool.length)];
                            sObj.occupied = true;
                            sObj.data = { ...sel, room: primaryRoom };
                            usageTracker[sObj.day][sel.name] = (usageTracker[sObj.day][sel.name] || 0) + 1;
                        }
                    });

                    const subCountersAcrossWeek = {};
                    dailySlots.sort((a, b) => {
                        const dayOrder = days.indexOf(a.day) - days.indexOf(b.day);
                        if (dayOrder !== 0) return dayOrder;
                        return lectureSlots.findIndex(ls => ls.label === a.slot) - lectureSlots.findIndex(ls => ls.label === b.slot);
                    }).forEach(slot => {
                        if (slot.data) {
                            const name = slot.data.name;
                            subCountersAcrossWeek[name] = (subCountersAcrossWeek[name] || 0) + 1;
                            slot.data.sequence = subCountersAcrossWeek[name];
                        }
                    });

                    await saveToCloud(dailySlots);
                } catch (err) { setError('Configuration error.'); } finally { setLoading(false); }
            };

            const downloadPDF = async () => {
                if (!timetableRef.current) return;
                try {
                    const element = timetableRef.current;
                    const canvas = await html2canvas(element, { 
                        scale: 2, useCORS: true, logging: false, backgroundColor: '#ffffff'
                    });
                    const pdf = new jspdf.jsPDF('l', 'mm', 'a4');
                    const pageWidth = 297; const pageHeight = 210;
                    const canvasRatio = canvas.width / canvas.height;
                    const pageRatio = pageWidth / pageHeight;
                    let finalWidth, finalHeight;
                    if (canvasRatio > pageRatio) {
                        finalWidth = pageWidth - 20; finalHeight = finalWidth / canvasRatio;
                    } else {
                        finalHeight = pageHeight - 20; finalWidth = finalHeight * canvasRatio;
                    }
                    pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 10, 10, finalWidth, finalHeight);
                    pdf.save(`${className || 'Timetable'}.pdf`);
                } catch (err) { setError("PDF Failed."); }
            };

            const loadFromHistory = (item) => {
                setClassName(item.className || '');
                setRooms(item.rooms || '');
                setSubjects(item.subjects || []);
                setTimetable(item.timetable || null);
                setShowHistory(false);
            };

            return (
                <div className="min-h-screen bg-slate-950 py-10 px-4">
                    <div className="max-w-7xl mx-auto">
                        
                        <div className="flex justify-between items-center mb-8 px-4 text-[10px] font-black uppercase tracking-[0.4em] text-white/20">
                            <div className="flex items-center gap-2">
                                <div className={`w-2 h-2 rounded-full ${user ? 'bg-teal-500 animate-pulse' : 'bg-slate-700'}`}></div>
                                {user ? `Cloud Protected` : `Local Node`}
                            </div>
                            <button onClick={() => setShowHistory(!showHistory)} className="hover:text-teal-400 transition-colors uppercase font-bold tracking-widest flex items-center gap-2">
                                <IconHistory className="w-3 h-3" /> Archive ({history.length})
                            </button>
                        </div>

                        {showHistory && (
                            <div className="fixed inset-0 z-50 flex items-center justify-center p-6 animate-in fade-in duration-300">
                                <div className="absolute inset-0 bg-slate-950/90 backdrop-blur-xl" onClick={() => setShowHistory(false)}></div>
                                <div className="relative glass-panel w-full max-w-4xl max-h-[80vh] rounded-[3rem] p-10 overflow-hidden flex flex-col shadow-2xl border border-white/10 text-white">
                                    <div className="flex justify-between items-center mb-10">
                                        <h2 className="text-3xl font-black flex items-center gap-4"><IconHistory className="text-teal-400" /> Archive</h2>
                                        <button onClick={() => setShowHistory(false)} className="text-white/40 hover:text-white uppercase font-black text-xs">Close</button>
                                    </div>
                                    <div className="overflow-y-auto custom-scrollbar flex-1 pr-4 space-y-4">
                                        {history.map(item => (
                                            <div key={item.id} onClick={() => loadFromHistory(item)} className="group flex items-center justify-between p-8 bg-white/5 rounded-3xl border border-white/5 hover:border-teal-500/30 transition-all cursor-pointer">
                                                <div>
                                                    <h3 className="font-black text-xl mb-1 text-white">{item.className || 'Unnamed Batch'}</h3>
                                                    <p className="text-[10px] uppercase font-bold text-white/30 tracking-widest">{new Date(item.timestamp).toLocaleString()}</p>
                                                </div>
                                                <div className="w-10 h-10 bg-teal-500/10 rounded-full flex items-center justify-center text-teal-400 group-hover:bg-teal-500 group-hover:text-white transition-all"><IconRefresh className="w-4 h-4"/></div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        <div className="text-center mb-16">
                            <div className="inline-flex items-center justify-center p-5 bg-teal-500/10 rounded-[2.5rem] shadow-2xl mb-8 border border-white/5">
                                <IconSparkles className="text-teal-400 w-12 h-12 animate-pulse-soft" />
                            </div>
                            <h1 className="text-5xl md:text-7xl font-black tracking-tighter mb-4 text-white uppercase pdf-fix">Schedule Engine Pro</h1>
                            <p className="text-teal-300/40 text-xl font-medium tracking-wide uppercase italic">Advanced Webhook-Validated Orchestration</p>
                        </div>

                        {!loading && !timetable && (
                            <div className="max-w-4xl mx-auto space-y-8 animate-in fade-in zoom-in-95 duration-500">
                                <div className="glass-panel p-10 md:p-14 rounded-[4rem] shadow-2xl space-y-12">
                                    <h2 className="text-3xl font-black flex items-center gap-4 text-white"><IconLayout className="text-teal-400" /> Configuration Matrix</h2>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-10">
                                        <div className="space-y-4">
                                            <label className="text-[10px] font-black uppercase text-teal-500 tracking-[0.3em] ml-2">Batch Identity</label>
                                            <input type="text" value={className} onChange={e => setClassName(e.target.value)} placeholder="e.g. SE A" className="w-full px-8 py-6 rounded-3xl bg-white/5 border border-white/10 text-white font-black text-xl focus:border-teal-500 outline-none transition-all placeholder:text-white/5" />
                                        </div>
                                        <div className="space-y-4">
                                            <label className="text-[10px] font-black uppercase text-teal-500 tracking-[0.3em] ml-2">Location Mapping</label>
                                            <input type="text" value={rooms} onChange={e => setRooms(e.target.value)} placeholder="e.g. 321, Lab 4" className="w-full px-8 py-6 rounded-3xl bg-white/5 border border-white/10 text-white font-black text-xl focus:border-teal-500 outline-none transition-all placeholder:text-white/5" />
                                        </div>
                                    </div>
                                    <div className="space-y-6">
                                        <div className="flex items-center justify-between px-2">
                                            <label className="text-xs font-black uppercase text-white/40 tracking-[0.4em]">Subjects Cluster</label>
                                            <div className="flex items-center bg-white/5 rounded-full px-6 py-2 border border-white/10 text-white">
                                                <span className="text-[10px] font-black text-teal-500 mr-4">Slot Size:</span>
                                                <input type="number" min="4" max="12" value={subjectCount} onChange={e => handleSubjectCountChange(e.target.value)} className="w-8 bg-transparent text-center font-black outline-none" />
                                            </div>
                                        </div>
                                        <div className="space-y-4 max-h-[600px] overflow-y-auto pr-6 custom-scrollbar">
                                            {subjects.map((s, idx) => (
                                                <div key={s.id} className="p-10 bg-white/[0.02] rounded-[3.5rem] border border-white/5 space-y-8 hover:bg-white/[0.04] transition-all">
                                                    <div className="flex flex-col md:flex-row gap-6">
                                                        <input type="text" placeholder="Subject Title" value={s.name} onChange={e => updateSubject(idx, 'name', e.target.value)} className="flex-1 bg-transparent font-black text-2xl border-b-2 border-white/10 text-white outline-none focus:border-teal-500 py-2" />
                                                        <input type="text" placeholder="Lead Faculty" value={s.teacher} onChange={e => updateSubject(idx, 'teacher', e.target.value)} className="flex-1 bg-transparent font-bold text-xl border-b-2 border-white/10 text-teal-200 outline-none focus:border-emerald-500 py-2" />
                                                    </div>
                                                    <div className="flex justify-between items-center">
                                                        <div className="flex gap-3">
                                                            {[1,2,3,4,5].map(w => (
                                                                <button key={w} onClick={() => updateSubject(idx, 'weight', w)} className={`w-10 h-10 rounded-full border-2 transition-all flex items-center justify-center ${s.weight >= w ? 'border-teal-500 text-teal-500 bg-teal-500/10' : 'border-white/10 text-white/20 hover:border-white/30'}`}>
                                                                    <IconZap className="w-4 h-4" fill={s.weight >= w ? "currentColor" : "none"} />
                                                                </button>
                                                            ))}
                                                        </div>
                                                        <div className="flex bg-black/40 p-2 rounded-2xl border border-white/5">
                                                            <button disabled={s.weight>=3} onClick={() => updateSubject(idx, 'session', 'morning')} className={`px-6 py-2.5 rounded-xl text-[10px] font-black tracking-widest transition-all ${s.session==='morning'?'bg-teal-600 text-white shadow-lg':'text-white/20'}`}>AM</button>
                                                            <button disabled={s.weight>=3} onClick={() => updateSubject(idx, 'session', 'afternoon')} className={`px-6 py-2.5 rounded-xl text-[10px] font-black tracking-widest transition-all ${s.session==='afternoon'?'bg-emerald-600 text-white shadow-lg':'text-white/20'}`}>PM</button>
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="flex gap-6">
                                        <button onClick={generateTimetable} className="flex-1 py-8 rounded-[3rem] bg-gradient-to-br from-teal-500 via-teal-600 to-emerald-700 text-white font-black text-3xl shadow-2xl hover:scale-[1.02] transition-all flex items-center justify-center gap-4 uppercase tracking-tighter">
                                            Sync & Display ⚡
                                        </button>
                                        <button onClick={handleReset} className="w-24 rounded-[3rem] bg-white/5 border border-white/10 text-white/20 hover:text-white transition-all flex items-center justify-center"><IconRefresh className="w-6 h-6"/></button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {loading && (
                            <div className="flex flex-col items-center justify-center py-48">
                                <div className="w-24 h-24 border-4 border-teal-500 border-t-transparent rounded-full animate-spin mb-8 shadow-2xl shadow-teal-500/20"></div>
                                <h2 className="text-white font-black text-3xl tracking-tighter uppercase mb-2">Validating Webhook</h2>
                                <p className="text-teal-500/40 font-bold uppercase tracking-[0.4em] text-xs">Waiting for Secure Response</p>
                            </div>
                        )}

                        {Array.isArray(timetable) && !loading && (
                            <div className="space-y-16 animate-in fade-in slide-in-from-bottom-12 duration-700">
                                <div className="flex justify-between items-center px-10">
                                    <div className="flex items-center gap-6 text-white text-white">
                                        <div className="w-12 h-12 bg-teal-500 rounded-[1.5rem] flex items-center justify-center text-slate-950 shadow-2xl shadow-teal-500/30">
                                            <IconLayout className="w-6 h-6" />
                                        </div>
                                        <div>
                                            <h2 className="text-3xl font-black uppercase tracking-tighter">Webhook Response</h2>
                                        </div>
                                    </div>
                                    <div className="flex gap-4">
                                        <button onClick={() => setTimetable(null)} className="bg-white/5 px-6 py-3 rounded-[1.5rem] border border-white/10 font-bold text-white hover:bg-white/10 transition-all uppercase text-xs tracking-widest">Adjust</button>
                                        <button onClick={downloadPDF} className="bg-white text-slate-900 px-8 py-3 rounded-[1.5rem] font-black shadow-2xl hover:bg-teal-50 transition-all uppercase text-xs tracking-tighter flex items-center gap-2">
                                            <IconDownload className="w-4 h-4"/> Export PDF
                                        </button>
                                    </div>
                                </div>

                                <div className="timetable-scale-wrapper overflow-x-auto pb-10">
                                    <div ref={timetableRef} className="bg-white p-10 rounded-[4rem] shadow-2xl text-slate-950 border border-white overflow-hidden min-w-[1200px]">
                                        <div className="flex justify-between items-end border-b-[8px] border-slate-50 pb-10 mb-10 px-4">
                                            <div className="space-y-3">
                                                <div className="px-4 py-1 bg-slate-950 text-white inline-block rounded-full text-[9px] font-black uppercase tracking-[0.5em] mb-2">Verified Stream</div>
                                                <h3 className="text-6xl font-black text-slate-950 uppercase tracking-tighter leading-none pdf-fix">{className || 'SE A'}</h3>
                                                <div className="flex gap-4 items-center">
                                                    <p className="text-slate-400 font-bold uppercase tracking-[0.3em] text-[11px]">Room: {rooms.split(',')[0] || '321'}</p>
                                                    <div className="w-1.5 h-1.5 rounded-full bg-teal-500"></div>
                                                    <p className="text-slate-400 font-bold uppercase tracking-[0.3em] text-[11px]">Source: Verified Webhook</p>
                                                </div>
                                            </div>
                                            <div className="text-right">
                                                <div className="text-[10px] font-black text-slate-300 uppercase tracking-[0.5em] mb-1">Status: Online</div>
                                                <div className="text-3xl font-black text-teal-600 tracking-tighter uppercase">6 Lectures Complete</div>
                                            </div>
                                        </div>
                                        <table className="w-full border-separate border-spacing-2">
                                            <thead>
                                                <tr>
                                                    <th className="w-24"></th>
                                                    {days.map(day => (
                                                        <th key={day} className="p-4 text-center text-[10px] font-black uppercase tracking-[0.4em] text-slate-400 border border-slate-50 rounded-[1.5rem]">{day}</th>
                                                    ))}
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {lectureSlots.map(slot => {
                                                    if (slot.type === 'lunch') {
                                                        return (
                                                            <tr key="lunch">
                                                                <td className="p-4 text-right font-black text-slate-200 text-[9px] uppercase tracking-[0.2em]">{slot.label}</td>
                                                                <td colSpan={6} className="p-1">
                                                                    <div className="h-16 rounded-[2rem] bg-slate-50 border-2 border-dashed border-slate-100 flex items-center justify-center gap-6 text-slate-200 font-black uppercase tracking-[1em] text-[10px] pdf-fix">
                                                                        <IconCoffee className="w-5 h-5 text-slate-100" /> Lunch Break
                                                                    </div>
                                                                </td>
                                                            </tr>
                                                        );
                                                    }
                                                    return (
                                                        <tr key={slot.key}>
                                                            <td className="p-4 text-right font-black text-slate-950 text-[11px] leading-tight uppercase tracking-tighter w-24 pdf-fix">
                                                                {slot.label.split(' - ').map((t, idx) => (<div key={idx} className={idx === 1 ? 'text-slate-300' : ''}>{t}</div>))}
                                                            </td>
                                                            {days.map((day) => {
                                                                const entry = Array.isArray(timetable) ? timetable.find(i => i.day === day && i.slot === slot.label) : null;
                                                                const styles = getUniqueLiteStyle(entry?.data?.name, subjects.findIndex(s => s.name === entry?.data?.name));
                                                                return (
                                                                    <td key={day} className="p-1 min-w-[160px]">
                                                                        {entry && entry.data ? (
                                                                            <div style={styles} className="subject-card p-6 rounded-[2rem] h-36 flex flex-col justify-between relative overflow-hidden">
                                                                                <div style={{backgroundColor: styles.accentColor}} className="absolute top-4 right-4 px-3 py-1 rounded-full text-[8px] font-black uppercase tracking-widest opacity-80">#{entry.data.sequence}</div>
                                                                                <div>
                                                                                    <div className="font-black text-xl uppercase tracking-tighter leading-[1] mb-2 pdf-fix">{entry.data.name}</div>
                                                                                    <div className="text-[10px] font-bold opacity-60 flex items-center gap-1.5"><IconUser className="w-2.5 h-2.5" /> {entry.data.teacher}</div>
                                                                                </div>
                                                                                <div style={{backgroundColor: styles.accentColor}} className="text-[9px] font-black px-4 py-1.5 rounded-xl uppercase tracking-[0.2em] inline-block self-start shadow-sm pdf-fix">{entry.data.room}</div>
                                                                            </div>
                                                                        ) : (
                                                                            <div className="h-36 rounded-[2rem] bg-slate-50 border-2 border-dotted border-slate-100 flex flex-col items-center justify-center text-[9px] font-black text-slate-200 uppercase tracking-[0.3em] italic gap-2 opacity-50">
                                                                                <IconCode className="w-4 h-4 text-slate-100" /> Coding Time
                                                                            </div>
                                                                        )}
                                                                    </td>
                                                                );
                                                            })}
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                        <div className="mt-16 pt-8 border-t-4 border-slate-50 flex justify-between items-center text-[9px] font-black text-slate-200 uppercase tracking-[0.5em] px-4 pdf-fix">
                                            <span>Architecture Node v6.3</span>
                                            <span>Validated: {new Date().toLocaleDateString()}</span>
                                            <span>Secure Master Response</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        <div className="fixed bottom-10 right-10 flex flex-col gap-4 z-[100]">
                            {successMsg && <div className="p-6 bg-teal-600 text-white rounded-[2rem] shadow-2xl font-black uppercase tracking-widest text-[10px] animate-in slide-in-from-right-10 border border-white/20">{successMsg}</div>}
                            {error && <div className="p-6 bg-rose-600 text-white rounded-[2rem] shadow-2xl font-black uppercase tracking-widest text-[10px] animate-in slide-in-from-right-10 border border-white/20">{error}</div>}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
