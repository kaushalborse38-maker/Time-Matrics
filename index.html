<!DOCTYPE html>

            --brand-dark: #020617;
        }

            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--brand-dark);
            color: white;
            scroll-behavior: smooth;
        }

            content: '';

            width: 0;
            height: 2px;
            bottom: -4px;
            left: 0;

            transition: width 0.3s;

            display: flex; 
            align-items: center;

</head>

                                <div ref={timetableRef} className="bg-white p-12 text-slate-950 min-w-[1100px]">
                                    <div className="flex justify-between items-end mb-12 border-b-4 border-slate-50 pb-10">
                                        <div className="flex items-center gap-6">
                                            <AppLogo className="w-20 h-20" />
                                            <div>
                                                <div className="px-3 py-1 bg-teal-500 text-slate-950 inline-block rounded-full text-[9px] font-black uppercase tracking-[0.3em] mb-4">Your Timetable</div>
                                                <h3 className="text-5xl font-black tracking-tight text-slate-900 leading-none uppercase">{className || 'Schedule'}</h3>
                                                <div className="mt-2 flex gap-4 text-xs font-bold text-slate-400 uppercase tracking-widest">
                                                    <span>Rooms: {rooms || 'Assigned'}</span>
                                                    <span>•</span>
                                                    <span>Time Matrix System</span>
                                                </div>
                                            </div>
                                        </div>
                                        <div className="text-right">
                                            <div className="text-[10px] font-black text-teal-600 uppercase tracking-[0.4em] mb-2">Optimized Schedule</div>
                                            <div className="text-3xl font-black text-slate-900">Weekly View</div>
                                        </div>
                                    </div>

                                    <table className="w-full border-separate border-spacing-2">
                                        <thead>
                                            <tr>
                                                <th className="w-32"></th>
                                                {days.map(day => (
                                                    <th key={day} className="p-4 text-center text-[10px] font-black uppercase tracking-[0.3em] text-slate-300 border border-slate-50 rounded-2xl">{day}</th>
                                                ))}
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {lectureSlots.map(slot => {
                                                if (slot.type === 'lunch') {
                                                    return (
                                                        <tr key="lunch">
                                                            <td className="p-4 text-right font-black text-slate-200 text-[10px] uppercase tracking-widest">{slot.label}</td>
                                                            <td colSpan={6} className="p-1">
                                                                <div className="h-16 rounded-3xl bg-slate-50/50 border-2 border-dashed border-slate-100 flex items-center justify-center gap-4 text-slate-300 font-bold uppercase tracking-[1em] text-[10px]"><IconCoffee className="w-4 h-4" /> Lunch Break</div>
                                                            </td>
                                                        </tr>
                                                    );
                                                }
                                                return (
                                                    <tr key={slot.key}>
                                                        <td className="p-4 text-right font-black text-slate-900 text-xs leading-tight w-32 uppercase tracking-tighter">
                                                            {slot.label.split(' - ')[0]}<br/>
                                                            <span className="text-slate-200 text-[10px]">{slot.label.split(' - ')[1]}</span>
                                                        </td>
                                                        {days.map(day => {
                                                            const entry = timetable.find(i => i.day === day && i.slot === slot.label);
                                                            const styles = getUniqueLiteStyle(entry?.data?.name, subjects.findIndex(s => s.name === entry?.data?.name));
                                                            return (
                                                                <td key={day} className="p-1 min-w-[150px]">
                                                                    {entry && entry.data ? (
                                                                        <div style={styles} className="subject-card p-6 rounded-[2rem] h-32 flex flex-col justify-between relative overflow-hidden border">
                                                                            <div style={{backgroundColor: styles.accentColor}} className="absolute top-0 right-0 px-3 py-1 rounded-bl-xl text-[8px] font-black text-slate-400">#{entry.data.sequence}</div>
                                                                            <div>
                                                                                <div className="font-bold text-lg leading-tight mb-1 truncate">{entry.data.name}</div>
                                                                                <div className="text-[10px] font-bold opacity-60 flex items-center gap-1"><span className="opacity-40">Prof.</span> {entry.data.teacher}</div>
                                                                            </div>
                                                                            <div style={{backgroundColor: styles.accentColor}} className="text-[9px] font-bold px-3 py-1 rounded-lg uppercase self-start">{entry.data.room}</div>
                                                                        </div>
                                                                    ) : (
                                                                        <div className="h-32 rounded-[2rem] bg-slate-50 border border-slate-100/50 flex items-center justify-center text-[10px] font-bold text-slate-200 uppercase tracking-widest italic">PROXY</div>
                                                                    )}
                                                                </td>
                                                            );
                                                        })}
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>

                                    <div className="mt-12 pt-8 border-t border-slate-50 flex justify-between text-[10px] font-bold text-slate-300 uppercase tracking-[0.5em]">
                                        <span>System Status: Active</span>
                                        <span>Validated: {new Date().toLocaleDateString()}</span>
                                        <span>Strict Policy Compliant</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const HistoryModal = ({ history, setShowHistory, setClassName, setRooms, setSubjects, setTimetable, setCurrentView }) => (
            <div className="fixed inset-0 z-[1000] flex items-center justify-center p-6">
                <div className="absolute inset-0 bg-slate-950/80 backdrop-blur-md" onClick={() => setShowHistory(false)}></div>
                <div className="relative glass-panel w-full max-w-2xl rounded-[2.5rem] p-10 flex flex-col max-h-[80vh]">
                    <div className="flex justify-between items-center mb-10">
                        <h2 className="text-2xl font-bold flex items-center gap-3"><IconHistory className="text-teal-400" /> Archive</h2>
                        <button onClick={() => setShowHistory(false)} className="text-white/40 hover:text-white uppercase font-bold text-xs">Close</button>
                    </div>
                    <div className="overflow-y-auto custom-scrollbar flex-1 space-y-4 pr-2">
                        {history.length === 0 ? (
                            <div className="text-center py-20 text-white/20">No history found.</div>
                        ) : (
                            history.map(item => (
                                <div key={item.id} onClick={() => { 
                                    setClassName(item.className); 
                                    setRooms(item.rooms); 
                                    setSubjects(item.subjects); 
                                    setTimetable(item.timetable); 
                                    setShowHistory(false); 
                                    setCurrentView('generator');
                                }} className="p-6 bg-white/5 rounded-2xl border border-white/5 hover:border-teal-500/30 transition-all cursor-pointer group">
                                    <div className="flex justify-between items-center">
                                        <div>
                                            <h3 className="font-bold text-lg text-white">{item.className || 'Unnamed Batch'}</h3>
                                            <p className="text-[10px] text-white/30 uppercase font-bold tracking-widest mt-1">{new Date(item.timestamp).toLocaleString()}</p>
                                        </div>
                                        <div className="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center text-white/20 group-hover:bg-teal-500 group-hover:text-slate-950 transition-all">
                                            <IconRefresh className="w-4 h-4" />
                                        </div>
                                    </div>
                                </div>
                            ))
                        )}
                    </div>
                </div>
            </div>
        );

        function App() {
            const [currentView, setCurrentView] = useState('home'); 
            const [user, setUser] = useState(null);
            const [className, setClassName] = useState('');
            const [subjectCount, setSubjectCount] = useState(4); 
            const [subjects, setSubjects] = useState([
                { id: '1', name: '', teacher: '', session: 'morning', weight: 4 },
                { id: '2', name: '', teacher: '', session: 'morning', weight: 2 },
                { id: '3', name: '', teacher: '', session: 'afternoon', weight: 2 },
                { id: '4', name: '', teacher: '', session: 'afternoon', weight: 1 }
            ]);
            const [rooms, setRooms] = useState('');
            const [loading, setLoading] = useState(false);
            const [timetable, setTimetable] = useState(null);
            const [error, setError] = useState(null);
            const [history, setHistory] = useState([]);
            const [showHistory, setShowHistory] = useState(false);
            const [successMsg, setSuccessMsg] = useState(null);

            const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const lectureSlots = [
                { label: '11:00 AM - 12:00 PM', key: '11-12' },
                { label: '12:00 PM - 01:00 PM', key: '12-1' },
                { label: '01:00 PM - 02:00 PM', key: '1-2', type: 'lunch' },
                { label: '02:00 PM - 03:00 PM', key: '2-3' },
                { label: '03:00 PM - 04:00 PM', key: '3-4' },
                { label: '04:00 PM - 05:00 PM', key: '4-5' },
                { label: '05:00 PM - 06:00 PM', key: '5-6' }
            ];

            useEffect(() => {
                const loader = document.getElementById('init-loader');
                if (loader) {
                    setTimeout(() => {
                        loader.style.opacity = '0';
                        setTimeout(() => loader.style.display = 'none', 500);
                    }, 800);
                }

                let firebaseApp, auth, db;
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'timetable-gen-pro';
                
                try {
                    if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                        const firebaseConfig = JSON.parse(__firebase_config);
                        firebaseApp = initializeApp(firebaseConfig);
                        auth = getAuth(firebaseApp);
                        db = getFirestore(firebaseApp);

                        const initAuth = async () => {
                            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                                await signInWithCustomToken(auth, __initial_auth_token);
                            } else {
                                await signInAnonymously(auth);
                            }
                        };
                        initAuth();

                        onAuthStateChanged(auth, (currentUser) => {
                            setUser(currentUser);
                            if (currentUser) {
                                const historyCollection = collection(db, 'artifacts', appId, 'users', currentUser.uid, 'history');
                                onSnapshot(historyCollection, (snapshot) => {
                                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                                    setHistory(data.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0)));
                                });
                            }
                        });
                    }
                } catch (e) { console.warn("Firebase limited."); }
            }, []);

            const handleSubjectCountChange = (count) => {
                const val = Math.max(4, Math.min(9, parseInt(count) || 0));
                setSubjectCount(val);
                const newSubjects = [...subjects];
                if (val > subjects.length) {
                    for (let i = subjects.length; i < val; i++) {
                        newSubjects.push({ id: Math.random().toString(36).substr(2, 9), name: '', teacher: '', session: 'morning', weight: 1 });
                    }
                } else { newSubjects.splice(val); }
                setSubjects(newSubjects);
            };

            const updateSubject = (index, field, value) => {
                const newSubjects = [...subjects];
                newSubjects[index][field] = value;
                setSubjects(newSubjects);
            };

            const handleReset = () => {
                setClassName('');
                setSubjectCount(4);
                setSubjects([
                    { id: '1', name: '', teacher: '', session: 'morning', weight: 4 },
                    { id: '2', name: '', teacher: '', session: 'morning', weight: 1 },
                    { id: '3', name: '', teacher: '', session: 'afternoon', weight: 1 },
                    { id: '4', name: '', teacher: '', session: 'afternoon', weight: 1 }
                ]);
                setRooms(''); setTimetable(null); setError(null);
            };

            const generateTimetable = async () => {
                const validSubjects = subjects.filter(s => s.name && s.name.trim() !== '');
                if (validSubjects.length < 4) {
                    setError('Minimum 4 subjects required.');
                    return;
                }

                let totalRequiredSlots = 0;
                validSubjects.forEach(s => {
                    if (s.weight >= 4) totalRequiredSlots += 7;
                    else if (s.weight >= 2) totalRequiredSlots += 3.5;
                    else totalRequiredSlots += 2;
                });

                if (totalRequiredSlots >= 36) {
                    setError(`Capacity exceeded. Please reduce weights.`);
                    return;
                }

                setLoading(true); setError(null);
                
                try {
                    const roomList = rooms.split(',').map(r => r.trim()).filter(r => r !== '');
                    const primaryRoom = roomList[0] || 'Room 101';
                    const dailySlotsGrid = [];
                    days.forEach(day => {
                        lectureSlots.filter(ls => ls.type !== 'lunch').forEach((slot, idx) => {
                            dailySlotsGrid.push({ day, slot: slot.label, key: slot.key, session: idx < 2 ? 'morning' : 'afternoon', occupied: false, data: null });
                        });
                    });

                    const usagePerDay = {};
                    days.forEach(d => usagePerDay[d] = {});

                    const highPriority = validSubjects.filter(s => s.weight >= 4);
                    highPriority.forEach(sub => {
                        days.forEach(day => {
                            const available = dailySlotsGrid.find(s => s.day === day && !s.occupied);
                            if (available) {
                                available.occupied = true;
                                available.data = { ...sub, room: primaryRoom };
                                usagePerDay[day][sub.name] = 1;
                            }
                        });
                        const extra = dailySlotsGrid.find(s => !s.occupied && (usagePerDay[s.day][sub.name] || 0) < 2);
                        if (extra) {
                            extra.occupied = true;
                            extra.data = { ...sub, room: primaryRoom };
                            usagePerDay[extra.day][sub.name] = (usagePerDay[extra.day][sub.name] || 0) + 1;
                        }
                    });

                    const otherSubs = validSubjects.filter(s => s.weight < 4).sort((a,b) => b.weight - a.weight);
                    otherSubs.forEach(sub => {
                        let target = sub.weight >= 2 ? 4 : 2;
                        let placed = 0;
                        const availablePositions = dailySlotsGrid.filter(s => !s.occupied).sort(() => Math.random() - 0.5);
                        for (let pos of availablePositions) {
                            if (placed >= target) break;
                            if ((usagePerDay[pos.day][sub.name] || 0) < 1) {
                                pos.occupied = true;
                                pos.data = { ...sub, room: primaryRoom };
                                usagePerDay[pos.day][sub.name] = 1;
                                placed++;
                            }
                        }
                    });

                    // FINAL SMART FILL PHASE
                    dailySlotsGrid.forEach(slot => {
                        if (!slot.occupied) {
                            const day = slot.day;
                            const shuffledSubs = [...validSubjects].sort(() => Math.random() - 0.5);
                            for (let sub of shuffledSubs) {
                                const currentDayUsage = usagePerDay[day][sub.name] || 0;
                                if (currentDayUsage < 2) {
                                    const daySlots = dailySlotsGrid.filter(s => s.day === day);
                                    const currentIdx = daySlots.indexOf(slot);
                                    const prevSlot = currentIdx > 0 ? daySlots[currentIdx - 1] : null;
                                    
                                    // Rule: No back-to-back same subject
                                    if (prevSlot && prevSlot.data && prevSlot.data.name === sub.name) continue;
                                    
                                    slot.occupied = true;
                                    slot.data = { ...sub, room: primaryRoom };
                                    usagePerDay[day][sub.name] = currentDayUsage + 1;
                                    break;
                                }
                            }
                        }
                    });

                    // 3. Shuffle & Sequence
                    days.forEach(day => {
                        const daySlots = dailySlotsGrid.filter(s => s.day === day);
                        const occupiedData = daySlots.filter(s => s.occupied).map(s => s.data).sort(() => Math.random() - 0.5);
                        let ptr = 0;
                        daySlots.forEach(slot => { if (slot.occupied) slot.data = occupiedData[ptr++]; });
                    });

                    const weekCounter = {};
                    dailySlotsGrid.forEach(slot => {
                        if (slot.data) {
                            weekCounter[slot.data.name] = (weekCounter[slot.data.name] || 0) + 1;
                            slot.data.sequence = weekCounter[slot.data.name];
                        }
                    });

                    const docData = { className, rooms, subjects, timetable: dailySlotsGrid, timestamp: Date.now(), creatorId: user?.uid || 'offline' };
                    
                    fetch(WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(docData) }).catch(() => {});

                    setTimetable(dailySlotsGrid);
                    setSuccessMsg("Timetable generated successfully!");
                    setTimeout(() => setSuccessMsg(null), 3000);
                } catch (err) { setError('Generation failed.'); } finally { setLoading(false); }
            };

            const downloadPDF = async (ref) => {
                if (!ref.current) return;
                const btn = document.getElementById('dl-btn');
                const originalText = btn.innerText;
                btn.innerText = 'Processing...';
                try {
                    const canvas = await html2canvas(ref.current, { scale: 2, useCORS: true, backgroundColor: '#ffffff' });
                    const imgData = canvas.toDataURL('image/png');
                    const pdf = new jspdf.jsPDF('l', 'mm', 'a4');
                    
                    const pdfWidth = pdf.internal.pageSize.getWidth();
                    const pdfHeight = pdf.internal.pageSize.getHeight();
                    const margin = 10;
                    
                    // Maintain aspect ratio while fitting the page
                    let finalWidth = pdfWidth - (margin * 2);
                    let finalHeight = (canvas.height * finalWidth) / canvas.width;

                    // If calculated height exceeds page height, scale based on height instead
                    if (finalHeight > (pdfHeight - margin * 2)) {
                        finalHeight = pdfHeight - (margin * 2);
                        finalWidth = (canvas.width * finalHeight) / canvas.height;
                    }

                    // Center the image
                    const xPos = (pdfWidth - finalWidth) / 2;
                    const yPos = (pdfHeight - finalHeight) / 2;

                    pdf.addImage(imgData, 'PNG', xPos, yPos, finalWidth, finalHeight);
                    pdf.save(`${className || 'Timetable'}_Time_Matrix.pdf`);
                } catch (err) { 
                    setError("PDF export failed."); 
                    console.error(err);
                }
                btn.innerText = originalText;
            };

            const getUniqueLiteStyle = (subjectName, index) => {
                if (!subjectName) return { backgroundColor: '#f8fafc', borderColor: '#f1f5f9', color: '#94a3b8', accentColor: '#f1f5f9' };
                let nameHash = 0;
                for (let i = 0; i < subjectName.length; i++) { nameHash = subjectName.charCodeAt(i) + ((nameHash << 5) - nameHash); }
                const baseHue = (Math.abs(nameHash) + (index * 137.5)) % 360;
                return { backgroundColor: `hsl(${baseHue}, 70%, 97%)`, borderColor: `hsl(${baseHue}, 50%, 90%)`, color: `hsl(${baseHue}, 80%, 15%)`, accentColor: `hsl(${baseHue}, 60%, 92%)` };
            };

            return (
                <div className="min-h-screen bg-slate-950">
                    <Navbar currentView={currentView} setCurrentView={setCurrentView} />
                    <main>
                        {currentView === 'home' && <HomePage setCurrentView={setCurrentView} />}
                        {currentView === 'generator' && (
                            <GeneratorView 
                                className={className} setClassName={setClassName}
                                rooms={rooms} setRooms={setRooms}
                                subjects={subjects} subjectCount={subjectCount}
                                handleSubjectCountChange={handleSubjectCountChange}
                                updateSubject={updateSubject}
                                generateTimetable={generateTimetable}
                                handleReset={handleReset}
                                loading={loading}
                                timetable={timetable} setTimetable={setTimetable}
                                downloadPDF={downloadPDF}
                                setShowHistory={setShowHistory}
                                history={history}
                                days={days} lectureSlots={lectureSlots}
                                getUniqueLiteStyle={getUniqueLiteStyle}
                            />
                        )}
                        {currentView === 'about' && <AboutPage />}
                    </main>
                    {showHistory && (
                        <HistoryModal 
                            history={history} setShowHistory={setShowHistory}
                            setClassName={setClassName} setRooms={setRooms}
                            setSubjects={setSubjects} setTimetable={setTimetable}
                            setCurrentView={setCurrentView}
                        />
                    )}
                    <footer className="border-t border-white/5 py-20 px-6">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-10">
                            <div className="text-center md:text-left">
                                <div className="flex items-center justify-center md:justify-start gap-2 mb-4">
                                    <AppLogo className="w-8 h-8" />
                                    <span className="text-lg font-bold">Time Matrix</span>
                                </div>
                                <p className="text-white/40 text-sm max-w-xs">Smart Timetable Generation Made Simple. Made for students & teachers.</p>
                            </div>
                            <div className="flex gap-10 text-sm font-medium text-white/60">
                                <button onClick={() => setCurrentView('home')} className="hover:text-teal-400">Home</button>
                                <button onClick={() => setCurrentView('generator')} className="hover:text-teal-400">Generate</button>
                                <button onClick={() => setCurrentView('about')} className="hover:text-teal-400">About</button>
                            </div>
                            <div className="text-xs font-bold text-white/20 tracking-widest uppercase">
                                © 2026 TIME MATRIX PRO
                            </div>
                        </div>
                    </footer>
                    <div className="fixed bottom-8 right-8 z-[100] flex flex-col gap-4">
                        {successMsg && <div className="px-8 py-4 bg-teal-600 text-white rounded-2xl shadow-2xl font-bold text-sm animate-in slide-in-from-right-10 border border-white/20">{successMsg}</div>}
                        {error && <div className="px-8 py-4 bg-rose-600 text-white rounded-2xl shadow-2xl font-bold text-sm animate-in slide-in-from-right-10 border border-white/20 max-w-sm">{error}</div>}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
